<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up ÔÇö AI-based Urban Traffic Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;
  background:linear-gradient(140deg,#0f172a 0%,#1e1b4b 40%,#312e81 70%,#1e40af 100%);
  display:flex;flex-direction:column}
nav{padding:16px 40px;display:flex;justify-content:space-between;align-items:center;
    background:rgba(0,0,0,0.2);backdrop-filter:blur(6px)}
.brand{color:#818cf8;font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:2px}
.nav-r{color:rgba(255,255,255,0.5);font-size:.85rem}
.hero{text-align:center;padding:70px 20px 40px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-family:'Bebas Neue';font-size:clamp(2.3rem,6vw,4rem);color:#fff;letter-spacing:3px;line-height:1.1;text-shadow:0 4px 30px rgba(99,102,241,.6)}
.sub{color:rgba(255,255,255,.65);margin-top:14px;font-size:1rem;max-width:520px;line-height:1.6}
.card{background:rgba(15,23,42,.8);border:1px solid rgba(99,102,241,.3);border-radius:20px;padding:40px 36px;width:100%;max-width:460px;margin-top:34px;backdrop-filter:blur(10px)}
.card h2{text-align:center;color:#e2e8f0;font-size:1.45rem;font-weight:700;margin-bottom:24px}
label{color:rgba(255,255,255,.7);font-size:.85rem;margin-bottom:6px;display:block;text-align:left}
input[type=text],input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(99,102,241,.3);background:rgba(30,27,75,.5);color:#e2e8f0;font-size:.95rem;margin-bottom:16px;outline:none;transition:.2s}
input:focus{border-color:#818cf8;background:rgba(49,46,129,.5)}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.5px}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.err{background:rgba(220,38,38,.2);border:1px solid rgba(220,38,38,.4);color:#fca5a5;padding:10px;border-radius:8px;margin-bottom:16px;font-size:.85rem;text-align:center}
.hint{text-align:center;color:rgba(255,255,255,.45);font-size:.8rem;margin-top:14px}
.hint a{color:#c7d2fe;text-decoration:none;font-weight:600}
.hint a:hover{text-decoration:underline}
</style>
</head>
<body>
<nav><span class="brand">AI-UTMS</span><span class="nav-r">SRM Institute of Science & Technology</span></nav>
<div class="hero">
  <h1>Create Account</h1>
  <p class="sub">Sign up to access the traffic dashboard. The first account becomes admin automatically.</p>
  <div class="card">
    <h2>Register</h2>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required>
      <label>Password</label>
      <input type="password" name="password" placeholder="Min 6 characters" required>
      <label>Confirm Password</label>
      <input type="password" name="confirm_password" placeholder="Re-enter password" required>
      <button class="btn" type="submit">Create Account</button>
    </form>
    <p class="hint">Already registered? <a href="/">Login here</a></p>
  </div>
</div>
</body>
</html>
